name: Update A-share technical report

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 09:00 China Standard Time (01:00 UTC), Monday to Friday.
    - cron: "0 1 * * 1-5"

permissions:
  contents: write

concurrency:
  group: a-share-monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch data and calculate indicators
        run: python src/market_monitor.py

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ohlcv.csv output/technical_report.csv output/technical_report.md
          if git diff --cached --quiet; then
            echo "No market-data changes to commit."
          else
            git commit -m "chore: update A-share technical report"
            git push
          fi
